name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Bundled runtime, models and game data
        run: |
          ./scripts/build-runtime.sh
          ./scripts/fetch-models.sh
          [ -x scripts/fetch-data.sh ] && ./scripts/fetch-data.sh || true
      - name: Python tests
        run: ./scripts/test.sh
      - name: Package plugin
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WFHelper-decky
          path: out/WFHelper.zip
